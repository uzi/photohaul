name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # photohaul's in-camera lock detection uses the BSD UF_IMMUTABLE flag
    # (st_flags / chflags), which only exists on macOS — so the suite runs there.
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Zero dependencies — nothing to install.
      - run: make test
