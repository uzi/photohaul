name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # photohaul's in-camera lock detection is per-OS (macOS UF_IMMUTABLE, Windows
    # FILE_ATTRIBUTE_READONLY; Linux doesn't detect locks - no Lightroom there), so
    # the suite runs on all three. macOS/Windows exercise a real protect bit; on
    # Linux the lock tests skip (no protect bit is detected there).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Zero dependencies — nothing to install. Invoke unittest directly so the
      # step is identical on Windows (no make / python3 there).
      - run: python -m unittest discover -s tests
